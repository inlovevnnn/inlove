<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://i.postimg.cc/qvjz8QFW/Logo.png" />
    <title>Dành Tặng Thu Vân ❤️</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background-color: #0b0205;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- PHẦN MÀN HÌNH MỞ ĐẦU (MODAL-INICIO) --- */
        #modal-inicio {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
        }

        .modal-card {
            background: linear-gradient(135deg, #fff0f5, #ffe4e1);
            border: 3px solid #ffb6c1;
            border-radius: 25px;
            padding: 35px 25px;
            width: 90%;
            max-width: 340px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(255, 105, 180, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .modal-gif {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #ff4d88;
            box-shadow: 0 0 20px rgba(255, 77, 136, 0.5);
        }

        .btn-start {
            background: linear-gradient(135deg, #ff4d88, #ff758c);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 136, 0.5);
            transition: transform 0.2s, background 0.3s;
            width: 100%;
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        /* Khung chính 9:16 */
        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * 9 / 16);
            max-height: 100vh;
            background-color: #0b0205;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Dòng chữ chúc mừng 20/10 */
        .greeting-title {
            position: absolute;
            top: 10%;
            width: 100%;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #ffb3ba;
            text-shadow: 0 0 12px rgba(255, 107, 97, 0.9), 0 0 25px rgba(255, 20, 147, 0.6);
            z-index: 5;
            letter-spacing: 1.5px;
            
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            transition: opacity 1.5s ease, transform 1.5s ease;
            pointer-events: none;
        }

        .greeting-title.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            animation: titleGlow 2.5s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            0% { text-shadow: 0 0 10px rgba(255, 107, 97, 0.8), 0 0 20px rgba(255, 20, 147, 0.5); }
            100% { text-shadow: 0 0 20px rgba(255, 182, 193, 1), 0 0 35px rgba(255, 105, 180, 0.9); }
        }

        /* Canvas vẽ trái tim */
        #heartCanvas {
            display: block;
            background-color: transparent;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        /* Nút mở thư */
        .letter-btn {
            position: absolute;
            bottom: 12%;
            background: linear-gradient(135deg, #ff4d88, #ff758c);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 77, 136, 0.7);
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transform: translateY(20px) scale(0.9);
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .letter-btn.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
            animation: pulseBtn 2s infinite;
        }

        @keyframes pulseBtn {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 77, 136, 0.6); }
            50% { transform: scale(1.06); box-shadow: 0 0 35px rgba(255, 117, 140, 0.9); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 77, 136, 0.6); }
        }

        /* Popup thư tình */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 2, 5, 0.85);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 100;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .letter-card {
            background: linear-gradient(135deg, #fff0f5, #ffe4e1);
            border: 3px solid #ffb6c1;
            border-radius: 25px;
            padding: 35px 25px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(255, 105, 180, 0.4);
            transform: scale(0.8) translateY(30px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .modal-overlay.active .letter-card {
            transform: scale(1) translateY(0);
        }

        .letter-card h2 {
            color: #d81b60;
            margin-top: 0;
            font-size: 24px;
            margin-bottom: 15px;
            font-family: 'Georgia', serif;
        }

        .letter-card p {
            color: #5c3a42;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .close-btn {
            background: #ff4d88;
            color: white;
            border: none;
            padding: 10px 28px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 136, 0.4);
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: #e03b72;
        }

        /* Hiệu ứng trái tim rơi */
        .falling-heart {
            position: absolute;
            top: -30px;
            color: rgba(255, 105, 180, 0.75);
            font-size: 18px;
            user-select: none;
            pointer-events: none;
            animation: fallDown linear infinite;
            z-index: 3;
        }

        @keyframes fallDown {
            0% { transform: translateY(0) rotate(0deg) scale(0.6); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 0.9; }
            100% { transform: translateY(105vh) rotate(360deg) scale(1.2); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Màn hình mở đầu (Modal-Inicio với GIF và nút Mở Quà) -->
    <div id="modal-inicio">
        <div class="modal-card">
            <img
              src="https://i.pinimg.com/originals/3f/4e/d3/3f4ed3cb1539cb42dc93b78020a3ef55.gif"
              alt="Bất ngờ"
              class="modal-gif"
            />
            <button id="btnComenzar" class="btn-start">Mở Quà 💌</button>
        </div>
    </div>

    <!-- Nhạc nền -->
    <audio id="bg-music" src="https://files.catbox.moe/wd3qke.mp3" preload="auto" loop></audio>

    <!-- Khung chính 9:16 -->
    <div class="app-container" id="appContainer">
        <div class="greeting-title" id="greetingTitle">✨ Chúc Mừng 20/10 ✨</div>
        <canvas id="heartCanvas"></canvas>
        <button class="letter-btn" id="letterBtn" onclick="openLetter()">
            💌 Xem Thư Gửi Thu Vân
        </button>
    </div>

    <!-- Popup thư tình -->
    <div class="modal-overlay" id="letterModal">
        <div class="letter-card">
            <h2>Gửi Tới Thu Vân ❤️</h2>
            <p id="messageText">
                Chúc Thu Vân ngày 20/10 thật nhiều niềm vui, luôn giữ vững phong độ học tập tốt và đạt kết quả đúng như mong đợi. Mong mọi điều may mắn nhất sẽ luôn đến với gia đình cậu và luôn đồng hành cùng Tớ trên mọi chặng đường sắp tới! 💕
            </p>
            <button class="close-btn" onclick="closeLetter()">Đóng lại ✨</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const letterBtn = document.getElementById('letterBtn');
        const letterModal = document.getElementById('letterModal');
        const greetingTitle = document.getElementById('greetingTitle');
        const modalInicio = document.getElementById('modal-inicio');
        const appContainer = document.getElementById('appContainer');
        const bgMusic = document.getElementById('bg-music');
        const btnComenzar = document.getElementById('btnComenzar');

        function resizeCanvas() {
            canvas.width = 1080;
            canvas.height = 1920;
        }
        resizeCanvas();

        let points = [];
        const totalPoints = 130;

        for (let i = 0; i < totalPoints; i++) {
            let t = (i * 2 * Math.PI) / totalPoints;
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            points.push({ x: x, y: y });
        }

        let currentIndex = 0;
        let lastTime = 0;
        const speedDelay = 45;
        let isStarted = false;

        function draw(timestamp) {
            if (!isStarted) return;

            if (!lastTime) lastTime = timestamp;
            let elapsed = timestamp - lastTime;

            ctx.fillStyle = '#0b0205';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2 - 20);

            // Lớp ngoài hồng đậm
            ctx.font = 'bold 18px Arial';
            ctx.fillStyle = '#ff4d88';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            let scaleOuter = 29;

            for (let i = 0; i <= currentIndex && i < points.length; i++) {
                let p = points[i];
                ctx.fillText("Thu Vân", p.x * scaleOuter, p.y * scaleOuter);
            }

            // Lớp trong hồng pastel sáng
            ctx.font = 'bold 14px Arial';
            ctx.fillStyle = '#ffc2d1'; 
            let scaleInner = 17;

            for (let i = 0; i <= currentIndex && i < points.length; i++) {
                let p = points[i];
                ctx.fillText("Thu Vân", p.x * scaleInner, p.y * scaleInner);
            }

            ctx.restore();

            if (elapsed > speedDelay) {
                if (currentIndex < points.length) {
                    currentIndex++;
                    lastTime = timestamp;
                } else {
                    greetingTitle.classList.add('show');
                    letterBtn.classList.add('show');
                }
            }

            requestAnimationFrame(draw);
        }

        // Sự kiện khi ấn nút "Mở Quà"
        btnComenzar.addEventListener('click', function () {
            isStarted = true;
            bgMusic.play().catch(e => console.log("Audio play blocked:", e));
            
            modalInicio.style.opacity = '0';
            setTimeout(() => {
                modalInicio.style.display = 'none';
            }, 800);

            requestAnimationFrame(draw);
            setInterval(createFallingHeart, 300);
        });

        function createFallingHeart() {
            if (!isStarted) return;
            const heart = document.createElement('div');
            heart.classList.add('falling-heart');
            const icons = ['❤️', '💖', '✨', '🌸', '💕'];
            heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            
            heart.style.left = Math.random() * 95 + '%';
            heart.style.fontSize = (Math.random() * 16 + 14) + 'px';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            heart.style.animationDelay = (Math.random() * 2) + 's';

            appContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        function openLetter() {
            letterModal.classList.add('active');
        }

        function closeLetter() {
            letterModal.classList.remove('active');
        }
    </script>

</body>
</html>
